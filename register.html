<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar - KerjaCuan</title><link rel="stylesheet" href="styles.css"></head><body><div class="auth card"><div class="center"><div class="brand">KerjaCuan</div><p class="muted">Buat akun pekerja</p></div><label class="label">Nama</label><input id="name" class="input" placeholder="Nama kamu"><label class="label">Email</label><input id="email" class="input" type="email" placeholder="Email"><label class="label">Password</label><input id="password" class="input" type="password" minlength="6" placeholder="Minimal 6 karakter"><br><br><button id="register" class="btn" style="width:100%">Daftar</button><p id="msg"></p><p class="center muted">Sudah punya akun? <a href="login.html" style="color:#21c55d">Login</a></p></div><script type="module">
import {auth,db,createUserWithEmailAndPassword,doc,setDoc} from "./firebase.js";
const $=id=>document.getElementById(id);
$("register").onclick=async()=>{try{const name=$("name").value.trim(),email=$("email").value.trim(),password=$("password").value;if(!name)throw Error("Nama wajib diisi.");const c=await createUserWithEmailAndPassword(auth,email,password);await setDoc(doc(db,"users",c.user.uid),{name,email,role:"worker",balance:0,createdAt:new Date().toISOString()});location.href="worker.html";}catch(e){$("msg").className="error";$("msg").textContent=e.message;}};
</script></body></html>
