<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - KerjaCuan</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #17233d;
    }

    header {
      height: 90px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .logo {
      font-size: 34px;
      font-weight: 800;
      color: #20bd59;
    }

    header a {
      color: #1760c8;
      font-size: 27px;
      font-weight: 700;
      text-decoration: none;
    }

    main {
      padding: 60px 20px;
    }

    .card {
      max-width: 630px;
      margin: auto;
      background: white;
      padding: 60px 50px;
      border-radius: 40px;
      box-shadow: 0 12px 35px rgba(20,40,80,.08);
    }

    h1 {
      font-size: 48px;
      margin: 0 0 25px;
    }

    .subtitle {
      color: #78869a;
      font-size: 28px;
      margin-bottom: 35px;
    }

    label {
      display: block;
      font-size: 25px;
      font-weight: 700;
      margin: 25px 0 10px;
    }

    input {
      width: 100%;
      padding: 22px;
      border: 1px solid #dce2eb;
      border-radius: 25px;
      font-size: 22px;
      outline: none;
    }

    input:focus {
      border-color: #20bd59;
    }

    button {
      margin-top: 32px;
      padding: 20px 38px;
      border: 0;
      border-radius: 22px;
      background: #20bd59;
      color: white;
      font-size: 25px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      display: none;
      margin: 20px 0;
      padding: 15px;
      border-radius: 15px;
      font-size: 18px;
    }

    .login {
      margin-top: 35px;
      font-size: 24px;
      color: #78869a;
    }

    .login a {
      color: #1760c8;
      font-weight: 700;
      text-decoration: none;
    }

    @media(max-width:600px) {
      .logo {
        font-size: 30px;
      }

      header a {
        font-size: 22px;
      }

      .card {
        padding: 40px 25px;
        border-radius: 30px;
      }

      h1 {
        font-size: 42px;
      }

      .subtitle {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">KerjaCuan</div>
  <a href="./login.html">Login</a>
</header>

<main>
  <div class="card">

    <h1>Buat Akun</h1>

    <div class="subtitle">
      Daftar sebagai worker.
    </div>

    <div id="message"></div>

    <form id="registerForm">

      <label>Nama</label>
      <input
        id="name"
        type="text"
        placeholder="Masukkan nama"
        required
      >

      <label>Email</label>
      <input
        id="email"
        type="email"
        placeholder="Masukkan email"
        required
      >

      <label>Password</label>
      <input
        id="password"
        type="password"
        placeholder="Minimal 6 karakter"
        minlength="6"
        required
      >

      <button id="registerBtn" type="submit">
        Daftar
      </button>

    </form>

    <div class="login">
      Sudah punya akun?
      <a href="./login.html">Login</a>
    </div>

  </div>
</main>
