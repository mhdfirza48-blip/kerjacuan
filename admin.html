<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin - KerjaCuan</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<nav class="navbar">

  <a href="admin.html" class="logo">
    KerjaCuan Admin
  </a>

  <button id="logout" class="btn btn-red">
    Keluar
  </button>

</nav>

<main class="container">


  <!-- TAMBAH JOB -->

  <div class="card">

    <h2 class="title">
      Tambah Job
    </h2>

    <label>Judul Job</label>

    <input
      id="title"
      placeholder="Contoh: Input data"
    >

    <label>Deskripsi</label>

    <textarea
      id="description"
      placeholder="Jelaskan pekerjaan..."
    ></textarea>

    <label>Reward</label>

    <input
      id="reward"
      type="number"
      placeholder="5000"
    >

    <button
      id="create"
      class="btn btn-primary"
    >
      + Tambah Job
    </button>

    <p id="createMsg"></p>

  </div>


  <!-- DAFTAR JOB -->

  <div class="card">

    <h2 class="title">
      Daftar Job
    </h2>

    <div id="jobs">
      Memuat...
    </div>

  </div>


  <!-- SUBMISSION -->

  <div class="card">

    <h2 class="title">
      Hasil Worker
    </h2>

    <div id="submissions">
      Memuat...
    </div>

  </div>

</main>


<script type="module">

import {
  auth,
  db,
  onAuthStateChanged,
  signOut,
  getDoc,
  getDocs,
  doc,
  collection,
  addDoc,
  updateDoc,
  query,
  orderBy,
  serverTimestamp,
  runTransaction
} from "./firebase.js";


let currentUser = null;


function rupiah(value) {

  return new Intl.NumberFormat(
    "id-ID",
    {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0
    }
  ).format(value || 0);

}


function esc(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


onAuthStateChanged(auth, async user => {

  if (!user) {

    window.location.href = "login.html";
    return;

  }

  currentUser = user;

  const adminSnap =
    await getDoc(
      doc(db, "admins", user.uid)
    );

  if (!adminSnap.exists()) {

    alert("Akses admin ditolak.");

    await signOut(auth);

    window.location.href =
      "login.html";

    return;

  }

  await loadJobs();
  await loadSubmissions();

});


/* =========================
   CREATE JOB
========================= */

document.getElementById("create")
  .onclick = async () => {

    const title =
      document.getElementById("title")
        .value
        .trim();

    const description =
      document.getElementById("description")
        .value
        .trim();

    const reward =
      Number(
        document.getElementById("reward")
          .value
      );

    const msg =
      document.getElementById("createMsg");

    msg.textContent = "";

    if (!title ||
        !description ||
        !reward ||
        reward <= 0) {

      msg.className = "error";

      msg.textContent =
        "Lengkapi judul, deskripsi, dan reward.";

      return;

    }

    try {

      await addDoc(
        collection(db, "jobs"),
        {
          title,
          description,
          reward,
          active: true,
          createdBy: currentUser.uid,
          createdAt: serverTimestamp()
        }
      );

      document.getElementById("title")
        .value = "";

      document.getElementById("description")
        .value = "";

      document.getElementById("reward")
        .value = "";

      msg.className = "success";

      msg.textContent =
        "Job berhasil dibuat.";

      await loadJobs();

    } catch (error) {

      msg.className = "error";

      msg.textContent =
        error.message;

    }

  };


/* =========================
   LOAD JOBS
========================= */

async function loadJobs() {

  const box =
    document.getElementById("jobs");

  box.innerHTML = "";

  const snap =
    await getDocs(
      query(
        collection(db, "jobs"),
        orderBy("createdAt", "desc")
      )
    );

  if (snap.empty) {

    box.innerHTML =
      `<div class="empty">
        Belum ada job.
      </div>`;

    return;

  }

  snap.forEach(item => {

    const data = item.data();

    const div =
      document.createElement("div");

    div.className = "job";

    div.innerHTML = `

      <h3>
        ${esc(data.title)}
      </h3>

      <p class="muted">
        ${esc(data.description)}
      </p>

      <p class="reward">
        ${rupiah(data.reward)}
      </p>

      <p>
        Status:
        <b>
          ${data.active ? "Aktif" : "Nonaktif"}
        </b>
      </p>

      <button class="btn btn-gray">
        ${data.active ? "Nonaktifkan" : "Aktifkan"}
      </button>

    `;

    div.querySelector("button")
      .onclick = async () => {

        await updateDoc(
          doc(db, "jobs", item.id),
          {
            active: !data.active
          }
        );

        await loadJobs();

      };

    box.appendChild(div);

  });

}


/* =========================
   LOAD SUBMISSIONS
========================= */

async function loadSubmissions() {

  const box =
    document.getElementById("submissions");

  box.innerHTML = "";

  const snap =
    await getDocs(
      collection(db, "submissions")
    );

  if (snap.empty) {

    box.innerHTML =
      `<div class="empty">
        Belum ada hasil worker.
      </div>`;

    return;

  }

  snap.forEach(item => {

    const data = item.data();

    const div =
      document.createElement("div");

    div.className = "job";

    div.innerHTML = `

      <h3>
        ${esc(data.jobTitle)}
      </h3>

      <p>
        Worker:
        <b>
          ${esc(data.workerEmail)}
        </b>
      </p>

      <p>
        ${esc(data.result)}
      </p>

      <p class="reward">
        Reward ${rupiah(data.reward)}
      </p>

      <p>
        Status:
        <span class="status ${data.status}">
          ${esc(data.status)}
        </span>
      </p>

      ${
        data.status === "pending"
        ?
        `
        <button
          class="btn btn-primary approve"
        >
          Approve
        </button>

        <button
          class="btn btn-red reject"
        >
          Reject
        </button>
        `
        :
        ""
      }

    `;

    if (data.status === "pending") {

      div.querySelector(".approve")
        .onclick = () =>
          approve(item.id, data);

      div.querySelector(".reject")
        .onclick = () =>
          reject(item.id);

    }

    box.appendChild(div);

  });

}


/* =========================
   APPROVE + SALDO
========================= */

async function approve(submissionId, data) {

  if (
    !confirm(
      "Approve hasil ini dan tambahkan reward ke saldo worker?"
    )
  ) return;

  try {

    await runTransaction(
      db,
      async transaction => {

        const submissionRef =
          doc(
            db,
            "submissions",
            submissionId
          );

        const userRef =
          doc(
            db,
            "users",
            data.workerId
          );

        const submissionSnap =
          await transaction.get(
            submissionRef
          );

        const userSnap =
          await transaction.get(
            userRef
          );

        if (!submissionSnap.exists()) {
          throw new Error(
            "Submission tidak ditemukan."
          );
        }

        if (!userSnap.exists()) {
          throw new Error(
            "Worker tidak ditemukan."
          );
        }

        const submission =
          submissionSnap.data();

        if (submission.status !== "pending") {

          throw new Error(
            "Submission sudah diproses."
          );

        }

        const user =
          userSnap.data();

        const oldBalance =
          Number(user.balance || 0);

        const reward =
          Number(submission.reward || 0);

        transaction.update(
          submissionRef,
          {
            status: "approved",
            approvedAt: serverTimestamp(),
            approvedBy: currentUser.uid
          }
        );

        transaction.update(
          userRef,
          {
            balance:
              oldBalance + reward
          }
        );

      }
    );

    alert(
      "Berhasil approve. Saldo worker bertambah."
    );

    await loadSubmissions();

  } catch (error) {

    alert(
      "Gagal approve: " +
      error.message
    );

  }

}


/* =========================
   REJECT
========================= */

async function reject(submissionId) {

  if (
    !confirm(
      "Tolak hasil pekerjaan ini?"
    )
  ) return;

  try {

    await updateDoc(
      doc(
        db,
        "submissions",
        submissionId
      ),
      {
        status: "rejected",
        rejectedAt: serverTimestamp(),
        rejectedBy: currentUser.uid
      }
    );

    await loadSubmissions();

  } catch (error) {

    alert(error.message);

  }

}


/* =========================
   LOGOUT
========================= */

document.getElementById("logout")
  .onclick = async () => {

    await signOut(auth);

    window.location.href =
      "login.html";

  };

</script>

</body>
</html>
