<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - KerjaCuan</title><link rel="stylesheet" href="styles.css"></head><body><header class="top"><div class="brand">KerjaCuan Admin</div><button id="logout" class="btn danger">Keluar</button></header><main class="container"><section class="card"><h2>Tambah Job</h2><label class="label">Judul</label><input id="title" class="input" placeholder="Contoh: Testing Website"><label class="label">Kategori</label><input id="category" class="input" placeholder="Testing"><label class="label">Reward (Rp)</label><input id="reward" class="input" type="number" min="0" placeholder="4300"><label class="label">Deskripsi</label><textarea id="description" class="textarea" placeholder="Jelaskan pekerjaan dengan jelas. Jangan meminta password/credential akun pribadi."></textarea><label class="label">Batas</label><input id="limit" class="input" placeholder="50 pekerja"><br><br><button id="create" class="btn" style="width:100%">+ Tambah Job</button><p id="jobmsg"></p></section><section class="card"><h2>Job Aktif</h2><div id="jobs" class="grid"></div></section><section class="card"><h2>Submission Menunggu</h2><div id="subs" class="grid"></div></section></main><script type="module">
import {auth,db,onAuthStateChanged,signOut,doc,getDoc,addDoc,collection,query,orderBy,getDocs,updateDoc,runTransaction,serverTimestamp} from "./firebase.js";
const $=id=>document.getElementById(id);let admin;
const money=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n||0);
onAuthStateChanged(auth,async u=>{if(!u)return location.href="login.html";const p=await getDoc(doc(db,"users",u.uid));if(p.data()?.role!=="admin"){alert("Akses admin ditolak.");return location.href="worker.html"}admin=u;loadJobs();loadSubs();});
$("logout").onclick=()=>signOut(auth).then(()=>location.href="login.html");
$("create").onclick=async()=>{try{const title=$("title").value.trim(),description=$("description").value.trim(),reward=Number($("reward").value);if(!title||!description||reward<=0)throw Error("Judul, deskripsi, dan reward wajib diisi.");await addDoc(collection(db,"jobs"),{title,category:$("category").value.trim()||"Job",description,reward,limit:$("limit").value.trim()||"Tidak ditentukan",status:"open",createdBy:admin.uid,createdAt:serverTimestamp()});$("jobmsg").className="success";$("jobmsg").textContent="Job berhasil dibuat.";["title","category","reward","description","limit"].forEach(x=>$(x).value="");loadJobs();}catch(e){$("jobmsg").className="error";$("jobmsg").textContent=e.message}};
async function loadJobs(){const box=$("jobs");box.innerHTML="";const snap=await getDocs(query(collection(db,"jobs"),orderBy("createdAt","desc")));for(const d of snap.docs){const j=d.data();const el=document.createElement("div");el.className="job";el.innerHTML=`<div class="row"><b>${esc(j.title)}</b><span class="reward">${money(j.reward)}</span></div><p>${esc(j.description)}</p><span class="pill">${j.status}</span>`;box.appendChild(el)}}
async function loadSubs(){const box=$("subs");box.innerHTML="";const snap=await getDocs(query(collection(db,"submissions"),orderBy("createdAt","desc")));if(snap.empty){box.innerHTML='<div class="muted">Belum ada submission.</div>';return}for(const d of snap.docs){const s=d.data();const el=document.createElement("div");el.className="job";el.innerHTML=`<b>${esc(s.jobTitle)}</b><p>Pekerja: ${esc(s.workerEmail)}</p><p>Hasil: ${esc(s.result)}</p><div class="row"><span class="pill">${s.status}</span><b>${money(s.reward)}</b></div>`;if(s.status==="pending"){const b=document.createElement("button");b.className="btn";b.textContent="Approve + Saldo";b.onclick=()=>approve(d.id,s);el.appendChild(document.createElement("br"));el.appendChild(b)}box.appendChild(el)}}
async function approve(subId,s){if(!confirm("Approve hasil ini dan tambahkan reward ke saldo pekerja?"))return;try{await runTransaction(db,async tx=>{const subRef=doc(db,"submissions",subId),userRef=doc(db,"users",s.workerId);const [subSnap,userSnap]=await Promise.all([tx.get(subRef),tx.get(userRef)]);if(!subSnap.exists())throw Error("Submission tidak ditemukan.");if(subSnap.data().status!=="pending")throw Error("Submission sudah diproses.");if(!userSnap.exists())throw Error("User tidak ditemukan.");const old=userSnap.data().balance||0;tx.update(subRef,{status:"approved",approvedBy:admin.uid,approvedAt:serverTimestamp()});tx.update(userRef,{balance:old+Number(s.reward||0),updatedAt:serverTimestamp()});});alert("Disetujui. Saldo bertambah.");loadSubs();}catch(e){alert(e.message)}}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script></body></html>
