<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - KerjaCuan</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

  <div class="logo">
    KerjaCuan Admin
  </div>

</header>


<main class="container">

  <div class="card">

    <h1>Admin</h1>

    <p class="subtitle">
      Kelola pekerjaan dan hasil pekerja.
    </p>

  </div>


  <!-- TAMBAH JOB -->

  <div class="card">

    <h2>Tambah Job</h2>


    <label>Judul Job</label>

    <input
      id="title"
      placeholder="Contoh: Input Data">


    <label>Deskripsi</label>

    <textarea
      id="description"
      placeholder="Jelaskan pekerjaan..."></textarea>


    <label>Reward</label>

    <input
      id="reward"
      type="number"
      placeholder="Contoh: 4300">


    <button
      class="btn"
      id="addJob">
      + Tambah Job
    </button>

  </div>


  <!-- JOB -->

  <div class="card">

    <h2>Daftar Job</h2>

    <div id="jobs">
      Memuat...
    </div>

  </div>


  <!-- SUBMISSIONS -->

  <div class="card">

    <h2>Hasil Pekerja</h2>

    <div id="submissions">
      Memuat...
    </div>

  </div>

</main>


<script type="module">

import {
  auth,
  db,
  onAuthStateChanged,
  collection,
  addDoc,
  getDocs,
  doc,
  getDoc,
  updateDoc,
  serverTimestamp
} from "./firebase.js";


/*
  GANTI DENGAN EMAIL ADMIN KAMU
*/

const ADMIN_EMAIL =
  "mhdfirza48@gmail.com";


let adminUser;


onAuthStateChanged(auth, async user => {

  if (!user) {

    location.href = "login.html";
    return;

  }


  if (user.email !== ADMIN_EMAIL) {

    document.body.innerHTML = `
      <div class="container">
        <div class="card center">
          <h1>Akses ditolak</h1>
          <p class="subtitle">
            Akun ini bukan akun admin.
          </p>
        </div>
      </div>
    `;

    return;

  }


  adminUser = user;

  loadJobs();

  loadSubmissions();

});


/* =====================
   TAMBAH JOB
===================== */

document
  .getElementById("addJob")
  .onclick = async () => {

    const title =
      document.getElementById("title")
        .value.trim();

    const description =
      document.getElementById("description")
        .value.trim();

    const reward =
      Number(
        document.getElementById("reward").value
      );


    if (!title || !description || !reward) {

      alert("Semua data job wajib diisi.");

      return;

    }


    try {

      await addDoc(
        collection(db, "jobs"),
        {

          title: title,

          description: description,

          reward: reward,

          active: true,

          createdAt: serverTimestamp()

        }
      );


      document.getElementById("title").value = "";

      document.getElementById("description").value = "";

      document.getElementById("reward").value = "";


      alert("Job berhasil ditambahkan.");

      loadJobs();


    } catch(error) {

      alert(error.message);

    }

  };


/* =====================
   LOAD JOB
===================== */

async function loadJobs() {

  const snap =
    await getDocs(
      collection(db, "jobs")
    );


  const box =
    document.getElementById("jobs");

  box.innerHTML = "";


  if (snap.empty) {

    box.innerHTML =
      "<p>Belum ada job.</p>";

    return;

  }


  snap.forEach(item => {

    const data = item.data();

    box.innerHTML += `

      <div class="job">

        <h3>${data.title}</h3>

        <p class="subtitle">
          ${data.description}
        </p>

        <span class="reward">
          Rp ${Number(data.reward)
            .toLocaleString("id-ID")}
        </span>

      </div>

    `;

  });

}


/* =====================
   LOAD HASIL
===================== */

async function loadSubmissions() {

  const snap =
    await getDocs(
      collection(db, "submissions")
    );


  const box =
    document.getElementById("submissions");

  box.innerHTML = "";


  if (snap.empty) {

    box.innerHTML =
      "<p>Belum ada hasil.</p>";

    return;

  }


  snap.forEach(item => {

    const data = item.data();


    const div =
      document.createElement("div");

    div.className = "job";


    div.innerHTML = `

      <h3>
        ${data.jobTitle || "Job"}
      </h3>

      <p>
        Pekerja:
        <b>${data.userEmail}</b>
      </p>

      <p>
        Reward:
        <b>
          Rp ${Number(data.reward || 0)
            .toLocaleString("id-ID")}
        </b>
      </p>

      <p>
        Hasil:
      </p>

      <div class="card">
        ${escapeHTML(data.hasil)}
      </div>

      <p>
        Status:
        <span class="status ${data.status}">
          ${data.status}
        </span>
      </p>

      ${
        data.status === "pending"
        ? `
          <button
            class="btn"
            onclick="approve('${item.id}')">
            ✓ Approve & Tambah Saldo
          </button>

          <button
            class="btn-red"
            onclick="reject('${item.id}')">
            Tolak
          </button>
        `
        : ""
      }

    `;


    box.appendChild(div);

  });

}


/* =====================
   APPROVE
===================== */

window.approve = async function(id) {

  try {

    const submissionRef =
      doc(db, "submissions", id);


    const submissionSnap =
      await getDoc(submissionRef);


    if (!submissionSnap.exists()) {

      alert("Data tidak ditemukan.");

      return;

    }


    const submission =
      submissionSnap.data();


    if (submission.status !== "pending") {

      alert("Hasil ini sudah diproses.");

      return;

    }


    const userRef =
      doc(db, "users", submission.userId);


    const userSnap =
      await getDoc(userRef);


    if (!userSnap.exists()) {

      alert("Akun pekerja tidak ditemukan.");

      return;

    }


    const userData =
      userSnap.data();


    const saldoLama =
      Number(userData.saldo || 0);


    const reward =
      Number(submission.reward || 0);


    const saldoBaru =
      saldoLama + reward;


    await updateDoc(
      userRef,
      {
        saldo: saldoBaru
      }
    );


    await updateDoc(
      submissionRef,
      {
        status: "approved",
        approvedAt: serverTimestamp()
      }
    );


    alert(
      "Berhasil approve. Saldo bertambah Rp " +
      reward.toLocaleString("id-ID")
    );


    loadSubmissions();


  } catch(error) {

    console.error(error);

    alert(
      "Gagal approve: " +
      error.message
    );

  }

};


/* =====================
   REJECT
===================== */

window.reject = async function(id) {

  if (!confirm("Tolak hasil ini?")) {
    return;
  }


  await updateDoc(
    doc(db, "submissions", id),
    {
      status: "rejected",
      rejectedAt: serverTimestamp()
    }
  );


  loadSubmissions();

};


function escapeHTML(text) {

  return String(text || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

</script>

</body>
</html>
