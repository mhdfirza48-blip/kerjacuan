<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profil</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="logo">KerjaCuan</div>
</header>


<main class="container">

  <div class="card">

    <h1>Profil</h1>

    <p class="subtitle">
      Email akun
    </p>

    <h3 id="email">
      Memuat...
    </h3>

    <button
      class="btn-red"
      id="logout">
      Keluar
    </button>

  </div>

</main>


<nav class="nav">

  <a href="index.html"><span>⌂</span>Beranda</a>
  <a href="job.html"><span>⇩</span>Job</a>
  <a href="tugas.html"><span>☑</span>Tugas</a>
  <a href="riwayat.html"><span>◷</span>Riwayat</a>
  <a href="saldo.html"><span>▣</span>Saldo</a>
  <a class="active" href="profil.html"><span>♙</span>Profil</a>

</nav>


<script type="module">

import {
  auth,
  onAuthStateChanged,
  signOut
} from "./firebase.js";


onAuthStateChanged(auth, user => {

  if (!user) {

    location.href = "login.html";
    return;

  }

  document.getElementById("email")
    .textContent = user.email;

});


document
  .getElementById("logout")
  .onclick = async () => {

    await signOut(auth);

    location.href = "login.html";

  };

</script>

</body>
</html>
