<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riwayat</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="logo">KerjaCuan</div>
</header>

<main class="container">

  <div class="card">

    <h1>Riwayat</h1>

    <div id="list">
      Memuat...
    </div>

  </div>

</main>


<nav class="nav">

  <a href="index.html"><span>⌂</span>Beranda</a>
  <a href="job.html"><span>⇩</span>Job</a>
  <a href="tugas.html"><span>☑</span>Tugas</a>
  <a class="active" href="riwayat.html"><span>◷</span>Riwayat</a>
  <a href="saldo.html"><span>▣</span>Saldo</a>
  <a href="profil.html"><span>♙</span>Profil</a>

</nav>


<script type="module">

import {
  auth,
  db,
  onAuthStateChanged,
  collection,
  getDocs,
  query,
  where
} from "./firebase.js";


onAuthStateChanged(auth, async user => {

  if (!user) {

    location.href = "login.html";
    return;

  }


  const q =
    query(
      collection(db, "submissions"),
      where("userId", "==", user.uid)
    );


  const snap =
    await getDocs(q);


  const list =
    document.getElementById("list");

  list.innerHTML = "";


  if (snap.empty) {

    list.innerHTML =
      "<p class='subtitle'>Belum ada riwayat.</p>";

    return;

  }


  snap.forEach(item => {

    const data = item.data();

    list.innerHTML += `

      <div class="job">

        <h3>${data.jobTitle || "Job"}</h3>

        <p>
          Reward:
          <b>Rp ${Number(data.reward || 0)
            .toLocaleString("id-ID")}</b>
        </p>

        <span class="status ${data.status}">
          ${data.status}
        </span>

      </div>

    `;

  });

});

</script>

</body>
</html>
