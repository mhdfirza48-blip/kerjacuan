<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - KerjaCuan</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<nav class="navbar">
  <a href="index.html" class="logo">KerjaCuan</a>

  <a href="register.html" class="nav-btn">
    Daftar
  </a>
</nav>

<main class="container">

  <div class="card">

    <h1 class="title">Masuk ke akun kamu</h1>

    <div id="error" class="error"></div>

    <label>Email</label>
    <input
      id="email"
      type="email"
      placeholder="Masukkan email"
    >

    <label>Password</label>
    <input
      id="password"
      type="password"
      placeholder="Masukkan password"
    >

    <button id="login" class="btn btn-primary">
      Login
    </button>

    <p class="muted">
      Belum punya akun?
      <a href="register.html" class="nav-btn">
        Daftar
      </a>
    </p>

  </div>

</main>

<script type="module">

import {
  auth,
  db,
  signInWithEmailAndPassword,
  getDoc,
  doc
} from "./firebase.js";

const errorBox = document.getElementById("error");

document.getElementById("login").onclick = async () => {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  errorBox.textContent = "";

  if (!email || !password) {
    errorBox.textContent =
      "Email dan password wajib diisi.";
    return;
  }

  try {

    const result =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    const uid = result.user.uid;

    const adminDoc =
      await getDoc(doc(db, "admins", uid));

    if (adminDoc.exists()) {
      window.location.href = "admin.html";
      return;
    }

    window.location.href = "worker.html";

  } catch (error) {

    errorBox.textContent =
      "Login gagal: " +
      error.message
        .replace("Firebase:", "")
        .trim();

  }

};

</script>

</body>
</html>
