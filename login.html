<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - KerjaCuan</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: white;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #1e293b;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #22c55e;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 28px;
      font-size: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #e2e8f0;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #475569;
      border-radius: 10px;
      background: #0f172a;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #22c55e;
    }

    input::placeholder {
      color: #64748b;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #16a34a;
    }

    button:disabled {
      background: #64748b;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .error {
      background: #7f1d1d;
      color: #fecaca;
    }

    .success {
      background: #14532d;
      color: #bbf7d0;
    }

    .register {
      text-align: center;
      margin-top: 20px;
      color: #94a3b8;
      font-size: 14px;
    }

    .register a {
      color: #22c55e;
      text-decoration: none;
      font-weight: bold;
    }

    .register a:hover {
      text-decoration: underline;
    }

    .loading {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      KerjaCuan
    </div>

    <div class="subtitle">
      Masuk ke akun kamu
    </div>

    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Masukkan email"
        autocomplete="email"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Masukkan password"
        autocomplete="current-password"
        required
      >

      <button
        type="submit"
        id="loginButton"
      >
        Login
      </button>

    </form>

    <div
      id="message"
      class="message">
    </div>

    <div class="register">
      Belum punya akun?
      <a href="register.html">
        Daftar
      </a>
    </div>

  </div>


  <!-- ========================================= -->
  <!-- FIREBASE -->
  <!-- ========================================= -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // =========================================
    // FIREBASE CONFIG
    // =========================================

    const firebaseConfig = {

      apiKey: "AIzaSyCIZtNC_dqyP19htXNcdf3TZSDWwGZqla5c",

      authDomain: "kerjacuan-374dd.firebaseapp.com",

      projectId: "kerjacuan-374dd",

      storageBucket: "kerjacuan-374dd.firebasestorage.app",

      messagingSenderId: "677864393276",

      appId: "1:677864393276:web:b6bd6852dc8ede6904d139",

      measurementId: "G-WZ27QDDH6L"

    };


    // =========================================
    // INITIALIZE FIREBASE
    // =========================================

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    // =========================================
    // ELEMENT
    // =========================================

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    // =========================================
    // SHOW MESSAGE
    // =========================================

    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

      message.style.display =
        "block";
    }


    // =========================================
    // FIREBASE ERROR
    // =========================================

    function getErrorMessage(error) {

      console.error("Firebase Error:", error);

      console.error(
        "Error Code:",
        error.code
      );

      console.error(
        "Error Message:",
        error.message
      );


      switch (error.code) {

        // AUTH

        case "auth/invalid-credential":
          return "Email atau password salah.";

        case "auth/invalid-login-credentials":
          return "Email atau password salah.";

        case "auth/user-not-found":
          return "Akun tidak ditemukan.";

        case "auth/wrong-password":
          return "Password salah.";

        case "auth/invalid-email":
          return "Format email tidak valid.";

        case "auth/user-disabled":
          return "Akun ini telah dinonaktifkan.";

        case "auth/too-many-requests":
          return "Terlalu banyak percobaan login. Coba lagi nanti.";

        case "auth/network-request-failed":
          return "Koneksi internet bermasalah.";

        case "auth/operation-not-allowed":
          return "Login Email/Password belum diaktifkan di Firebase.";

        // FIRESTORE

        case "permission-denied":
          return "Firestore menolak akses. Periksa Firestore Rules.";

        case "unavailable":
          return "Firestore tidak tersedia. Periksa koneksi internet dan Firestore.";

        case "failed-precondition":
          return "Firestore belum siap atau konfigurasi database bermasalah.";

        case "not-found":
          return "Dokumen pengguna tidak ditemukan.";

        case "deadline-exceeded":
          return "Koneksi ke Firestore terlalu lama.";

        case "unauthenticated":
          return "Sesi Firebase belum terautentikasi.";

        default:

          return (
            "Error: " +
            (error.code || "unknown") +
            " - " +
            (error.message || "Terjadi kesalahan.")
          );
      }
    }


    // =========================================
    // LOGIN
    // =========================================

    loginForm.addEventListener(
      "submit",
      async function(e) {

        e.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        if (!email || !password) {

          showMessage(
            "Email dan password wajib diisi.",
            "error"
          );

          return;
        }


        // =====================================
        // DISABLE BUTTON
        // =====================================

        loginButton.disabled = true;

        loginButton.textContent =
          "Memproses...";

        loginButton.classList.add(
          "loading"
        );

        message.style.display =
          "none";


        try {

          // ===================================
          // LOGIN FIREBASE AUTHENTICATION
          // ===================================

          console.log(
            "1. Mencoba login:",
            email
          );


          const userCredential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            userCredential.user;


          console.log(
            "2. AUTH BERHASIL"
          );

          console.log(
            "UID:",
            user.uid
          );

          console.log(
            "Email:",
            user.email
          );


          // ===================================
          // AMBIL DATA USER FIRESTORE
          // ===================================

          console.log(
            "3. Mencari users/" +
            user.uid
          );


          const userRef =
            doc(
              db,
              "users",
              user.uid
            );


          const userSnap =
            await getDoc(userRef);


          console.log(
            "4. FIRESTORE BERHASIL"
          );


          // ===================================
          // CEK DOKUMEN
          // ===================================

          if (!userSnap.exists()) {

            showMessage(
              "Login berhasil, tetapi data pengguna belum ditemukan.",
              "error"
            );

            console.error(
              "Dokumen tidak ditemukan:",
              "users/" + user.uid
            );

            return;
          }


          // ===================================
          // DATA USER
          // ===================================

          const userData =
            userSnap.data();


          console.log(
            "5. DATA USER:",
            userData
          );


          const role =
            userData.role || "user";


          // ===================================
          // ADMIN
          // ===================================

          if (role === "admin") {

            showMessage(
              "Login admin berhasil! Mengarahkan...",
              "success"
            );


            setTimeout(
              function() {

                window.location.href =
                  "admin.html";

              },
              800
            );


            return;
          }


          // ===================================
          // USER BIASA
          // ===================================

          showMessage(
            "Login berhasil! Mengarahkan...",
            "success"
          );


          setTimeout(
            function() {

              window.location.href =
                "index.html";

            },
            800
          );

        }


        // =====================================
        // ERROR
        // =====================================

        catch (error) {

          console.error(
            "LOGIN ERROR:",
            error
          );


          const errorMessage =
            getErrorMessage(error);


          showMessage(
            errorMessage,
            "error"
          );

        }


        // =====================================
        // ENABLE BUTTON
        // =====================================

        loginButton.disabled =
          false;

        loginButton.textContent =
          "Login";

        loginButton.classList.remove(
          "loading"
        );

      }
    );

  </script>

</body>
</html>
