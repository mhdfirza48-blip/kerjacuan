<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - KerjaCuan</title><link rel="stylesheet" href="styles.css"></head><body><div class="auth card"><div class="center"><div class="brand">KerjaCuan</div><p class="muted">Masuk ke akun kamu</p></div><label class="label">Email</label><input id="email" class="input" type="email" placeholder="Masukkan email"><label class="label">Password</label><input id="password" class="input" type="password" placeholder="Masukkan password"><br><br><button id="login" class="btn" style="width:100%">Login</button><p id="msg"></p><p class="center muted">Belum punya akun? <a href="register.html" style="color:#21c55d">Daftar</a></p></div><script type="module">
import {auth,db,signInWithEmailAndPassword,doc,getDoc} from "./firebase.js";
const $=id=>document.getElementById(id);
$("login").onclick=async()=>{ $("msg").textContent="Memproses..."; try{const c=await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value); const u=await getDoc(doc(db,"users",c.user.uid)); const role=u.data()?.role||"worker"; location.href=role==="admin"?"admin.html":"worker.html";}catch(e){$("msg").className="error";$("msg").textContent=e.message;}};
</script></body></html>
