<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - KerjaCuan</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: white;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #1e293b;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #22c55e;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #e2e8f0;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #475569;
      border-radius: 10px;
      background: #0f172a;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #22c55e;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #64748b;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
      font-size: 14px;
    }

    .error {
      background: #7f1d1d;
      color: #fecaca;
    }

    .success {
      background: #14532d;
      color: #bbf7d0;
    }

    .register {
      text-align: center;
      margin-top: 20px;
      color: #94a3b8;
      font-size: 14px;
    }

    .register a {
      color: #22c55e;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">KerjaCuan</div>

    <div class="subtitle">
      Masuk ke akun kamu
    </div>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Masukkan email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Masukkan password"
        required
      >

      <button type="submit" id="loginButton">
        Login
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="register">
      Belum punya akun?
      <a href="register.html">Daftar</a>
    </div>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc
    }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // =========================
    // FIREBASE CONFIG
    // =========================

    const firebaseConfig = {

      apiKey: "AIzaSyCIZtNC_dqyP19htXNcdf3TZSDwGZqla5c",

      authDomain: "kerjacuan-374dd.firebaseapp.com",

      projectId: "kerjacuan-374dd",

      storageBucket: "kerjacuan-374dd.firebasestorage.app",

      messagingSenderId: "677864393276",

      appId: "1:677864393276:web:b6bd6852dc8ede6904d139",

      measurementId: "G-WZ27QDDH6L"

    };


    // =========================
    // INITIALIZE FIREBASE
    // =========================

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // =========================
    // ELEMENT
    // =========================

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    // =========================
    // MESSAGE
    // =========================

    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

      message.style.display = "block";

    }


    // =========================
    // LOGIN
    // =========================

    loginForm.addEventListener("submit", async (e) => {

      e.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      loginButton.disabled = true;

      loginButton.textContent = "Memproses...";

      message.style.display = "none";


      try {

        // LOGIN FIREBASE AUTH

        const userCredential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user =
          userCredential.user;


        // =========================
        // CEK DATA USER DI FIRESTORE
        // =========================

        const userRef =
          doc(db, "users", user.uid);

        const userSnap =
          await getDoc(userRef);


        if (userSnap.exists()) {

          const userData =
            userSnap.data();


          // =========================
          // ADMIN
          // =========================

          if (userData.role === "admin") {

            showMessage(
              "Login admin berhasil. Mengarahkan...",
              "success"
            );

            setTimeout(() => {

              window.location.href =
                "admin.html";

            }, 800);

            return;
          }


          // =========================
          // USER BIASA
          // =========================

          showMessage(
            "Login berhasil. Mengarahkan...",
            "success"
          );

          setTimeout(() => {

            window.location.href =
              "index.html";

          }, 800);

        }

        else {

          // AKUN AUTH ADA,
          // TAPI DATA USERS BELUM ADA

          showMessage(
            "Akun berhasil login, tetapi data pengguna belum ditemukan.",
            "error"
          );

        }

      }

      catch (error) {

        console.error(error);


        let errorMessage =
          "Login gagal.";


        if (
          error.code ===
          "auth/invalid-credential"
        ) {

          errorMessage =
            "Email atau password salah.";

        }

        else if (
          error.code ===
          "auth/user-not-found"
        ) {

          errorMessage =
            "Akun tidak ditemukan.";

        }

        else if (
          error.code ===
          "auth/wrong-password"
        ) {

          errorMessage =
            "Password salah.";

        }

        else if (
          error.code ===
          "auth/invalid-email"
        ) {

          errorMessage =
            "Format email tidak valid.";

        }

        else if (
          error.code ===
          "auth/too-many-requests"
        ) {

          errorMessage =
            "Terlalu banyak percobaan. Coba lagi nanti.";

        }


        showMessage(
          errorMessage,
          "error"
        );

      }


      loginButton.disabled = false;

      loginButton.textContent =
        "Login";

    });

  </script>

</body>
</html>
