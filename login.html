<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - KerjaCuan</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: white;
    }

    .box {
      width: 100%;
      max-width: 620px;
      background: #1e293b;
      padding: 55px 50px;
      border-radius: 22px;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
    }

    .logo {
      text-align: center;
      color: #22c55e;
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 25px;
      margin-bottom: 45px;
    }

    label {
      display: block;
      color: #e2e8f0;
      font-size: 22px;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      height: 70px;
      padding: 0 22px;
      margin-bottom: 25px;
      border-radius: 14px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 20px;
      outline: none;
    }

    input:focus {
      border-color: #22c55e;
    }

    button {
      width: 100%;
      height: 70px;
      border: 0;
      border-radius: 14px;
      background: #22c55e;
      color: white;
      font-size: 25px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #64748b;
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
      font-size: 17px;
      line-height: 1.5;
    }

    .error {
      background: #991b1b;
      color: #fee2e2;
    }

    .success {
      background: #166534;
      color: #dcfce7;
    }

    .register {
      text-align: center;
      margin-top: 30px;
      color: #94a3b8;
      font-size: 20px;
    }

    .register a {
      color: #22c55e;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      KerjaCuan
    </div>

    <div class="subtitle">
      Masuk ke akun kamu
    </div>

    <form id="loginForm" novalidate>

      <label for="email">
        Email
      </label>

      <input
        id="email"
        type="email"
        placeholder="Masukkan email"
        autocomplete="email"
      >

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="Masukkan password"
        autocomplete="current-password"
      >

      <button id="loginButton" type="submit">
        Login
      </button>

    </form>

    <div id="errorBox" class="message error"></div>

    <div id="successBox" class="message success"></div>

    <div class="register">
      Belum punya akun?
      <a href="daftar.html">Daftar</a>
    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";


    /* =========================
       FIREBASE CONFIG
       ========================= */

    const firebaseConfig = {

      apiKey: "AIzaSyCIZtNC_dqyP19htXNcdf3TZSDwGZqla5c",

      authDomain:
        "kerjacuan-374dd.firebaseapp.com",

      projectId:
        "kerjacuan-374dd",

      storageBucket:
        "kerjacuan-374dd.firebasestorage.app",

      messagingSenderId:
        "677864393276",

      appId:
        "1:677864393276:web:b6bd6852dc8ede6904d139",

      measurementId:
        "G-WZ27QDDH6L"
    };


    /* =========================
       FIREBASE
       ========================= */

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);


    /* =========================
       ELEMENT
       ========================= */

    const form =
      document.getElementById("loginForm");

    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const button =
      document.getElementById("loginButton");

    const errorBox =
      document.getElementById("errorBox");

    const successBox =
      document.getElementById("successBox");


    /* =========================
       ERROR
       ========================= */

    function showError(message) {

      errorBox.textContent = message;

      errorBox.style.display = "block";

      successBox.style.display = "none";
    }


    /* =========================
       SUCCESS
       ========================= */

    function showSuccess(message) {

      successBox.textContent = message;

      successBox.style.display = "block";

      errorBox.style.display = "none";
    }


    /* =========================
       LOGIN
       ========================= */

    form.addEventListener("submit", async function(event) {

      /*
       * INI YANG MENCEGAH HALAMAN
       * REFRESH SENDIRI
       */

      event.preventDefault();

      event.stopPropagation();


      errorBox.style.display = "none";

      successBox.style.display = "none";


      const emailValue =
        email.value.trim();

      const passwordValue =
        password.value;


      if (emailValue === "") {

        showError(
          "Email wajib diisi."
        );

        email.focus();

        return;
      }


      if (passwordValue === "") {

        showError(
          "Password wajib diisi."
        );

        password.focus();

        return;
      }


      button.disabled = true;

      button.textContent =
        "Memproses...";


      try {

        const result =
          await signInWithEmailAndPassword(
            auth,
            emailValue,
            passwordValue
          );


        console.log(
          "LOGIN BERHASIL:",
          result.user.uid
        );


        /*
         * SIMPAN DATA LOGIN
         */

        localStorage.setItem(
          "uid",
          result.user.uid
        );

        localStorage.setItem(
          "email",
          result.user.email
        );


        showSuccess(
          "Login berhasil!"
        );


        /*
         * JANGAN LANGSUNG REDIRECT
         * KITA TES DULU
         */

        setTimeout(function() {

          window.location.href =
            "index.html";

        }, 1000);


      } catch (error) {

        console.error(
          "Firebase Login Error:",
          error
        );


        let message =
          "Login gagal.";


        if (
          error.code ===
          "auth/invalid-credential"
        ) {

          message =
            "Email atau password salah.";
        }

        else if (
          error.code ===
          "auth/invalid-email"
        ) {

          message =
            "Format email tidak valid.";
        }

        else if (
          error.code ===
          "auth/user-not-found"
        ) {

          message =
            "Akun dengan email tersebut belum terdaftar.";
        }

        else if (
          error.code ===
          "auth/wrong-password"
        ) {

          message =
            "Password salah.";
        }

        else if (
          error.code ===
          "auth/operation-not-allowed"
        ) {

          message =
            "Login Email/Password belum diaktifkan di Firebase.";
        }

        else if (
          error.code ===
          "auth/invalid-api-key"
        ) {

          message =
            "API Key Firebase tidak valid.";
        }

        else if (
          error.code ===
          "auth/network-request-failed"
        ) {

          message =
            "Internet bermasalah. Periksa koneksi.";
        }

        else if (
          error.code ===
          "auth/too-many-requests"
        ) {

          message =
            "Terlalu banyak percobaan login. Coba lagi nanti.";
        }

        else {

          message =
            error.code +
            " — " +
            error.message;
        }


        showError(message);


        /*
         * PENTING:
         * BISA LANGSUNG COBA LOGIN LAGI
         */

        button.disabled = false;

        button.textContent =
          "Login";

        password.value = "";

        password.focus();

      }

    });

  </script>

</body>
</html>
