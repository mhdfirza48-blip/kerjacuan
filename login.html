<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - KerjaCuan</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="auth">

  <div class="card">

    <div class="center">
      <div class="logo">KerjaCuan</div>

      <p class="subtitle">
        Masuk ke akun kamu
      </p>
    </div>


    <label>Email</label>

    <input
      id="email"
      type="email"
      placeholder="Masukkan email"
    >


    <label>Password</label>

    <input
      id="password"
      type="password"
      placeholder="Masukkan password"
    >


    <button
      class="btn"
      id="loginBtn">
      Login
    </button>


    <p id="error" class="center"></p>


    <p class="center">
      Belum punya akun?
      <a class="link" href="daftar.html">
        Daftar
      </a>
    </p>

  </div>

</div>


<script type="module">

import {
  auth,
  signInWithEmailAndPassword
} from "./firebase.js";


document
  .getElementById("loginBtn")
  .onclick = async function() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    if (!email || !password) {

      document.getElementById("error").textContent =
        "Email dan password wajib diisi.";

      return;
    }


    try {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


      window.location.href = "job.html";


    } catch(error) {

      document.getElementById("error").textContent =
        "Login gagal. Periksa email dan password.";

      console.error(error);

    }

  };

</script>

</body>
</html>
