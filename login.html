<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - KerjaCuan</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: white;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #1e293b;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #22c55e;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #e2e8f0;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #475569;
      border-radius: 10px;
      background: #0f172a;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #22c55e;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #64748b;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
      font-size: 14px;
      word-break: break-word;
    }

    .error {
      background: #7f1d1d;
      color: #fecaca;
    }

    .success {
      background: #14532d;
      color: #bbf7d0;
    }

    .register {
      text-align: center;
      margin-top: 20px;
      color: #94a3b8;
      font-size: 14px;
    }

    .register a {
      color: #22c55e;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">KerjaCuan</div>

    <div class="subtitle">
      Masuk ke akun kamu
    </div>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Masukkan email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Masukkan password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Login
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="register">
      Belum punya akun?
      <a href="register.html">Daftar</a>
    </div>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc
    }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // =========================
    // FIREBASE CONFIG
    // =========================

    const firebaseConfig = {

      apiKey: "AIzaSyCIZtNC_dqyP19htXNcdf3TZSDwGZqla5c",

      authDomain: "kerjacuan-374dd.firebaseapp.com",

      projectId: "kerjacuan-374dd",

      storageBucket: "kerjacuan-374dd.firebasestorage.app",

      messagingSenderId: "677864393276",

      appId: "1:677864393276:web:b6bd6852dc8ede6904d139",

      measurementId: "G-WZ27QDDH6L"

    };


    // =========================
    // FIREBASE
    // =========================

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // =========================
    // ELEMENT
    // =========================

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    // =========================
    // MESSAGE
    // =========================

    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

      message.style.display = "block";

    }


    // =========================
    // LOGIN
    // =========================

    loginForm.addEventListener("submit", async (e) => {

      e.preventDefault();


      const email =
        document.getElementById("email")
          .value
          .trim();

      const password =
        document.getElementById("password")
          .value;


      if (!email || !password) {

        showMessage(
          "Email dan password wajib diisi.",
          "error"
        );

        return;
      }


      loginButton.disabled = true;

      loginButton.textContent =
        "Memproses...";

      message.style.display =
        "none";


      try {

        // =========================
        // LOGIN FIREBASE AUTH
        // =========================

        const userCredential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user =
          userCredential.user;


        console.log(
          "Login Auth berhasil:",
          user.uid
        );


        // =========================
        // AMBIL DATA USER
        // =========================

        const userRef =
          doc(
            db,
            "users",
            user.uid
          );


        const userSnap =
          await getDoc(userRef);


        // =========================
        // DATA USER TIDAK ADA
        // =========================

        if (!userSnap.exists()) {

          showMessage(
            "Login berhasil, tetapi data users untuk UID ini belum ada di Firestore.",
            "error"
          );

          console.error(
            "Dokumen users tidak ditemukan. UID:",
            user.uid
          );

          loginButton.disabled = false;

          loginButton.textContent =
            "Login";

          return;
        }


        // =========================
        // DATA USER
        // =========================

        const userData =
          userSnap.data();


        console.log(
          "Data Firestore:",
          userData
        );


        // =========================
        // ADMIN
        // =========================

        if (userData.role === "admin") {

          showMessage(
            "Login admin berhasil!",
            "success"
          );


          setTimeout(() => {

            window.location.href =
              "admin.html";

          }, 700);


          return;
        }


        // =========================
        // USER BIASA
        // =========================

        showMessage(
          "Login berhasil!",
          "success"
        );


        setTimeout(() => {

          window.location.href =
            "index.html";

        }, 700);

      }


      catch (error) {

        console.error(
          "Firebase Login Error:",
          error
        );


        let errorMessage =
          "Login gagal.";


        switch (error.code) {

          case "auth/invalid-credential":

            errorMessage =
              "Email atau password salah.";

            break;


          case "auth/user-not-found":

            errorMessage =
              "Akun tidak ditemukan.";

            break;


          case "auth/wrong-password":

            errorMessage =
              "Password salah.";

            break;


          case "auth/invalid-email":

            errorMessage =
              "Format email tidak valid.";

            break;


          case "auth/too-many-requests":

            errorMessage =
              "Terlalu banyak percobaan login. Coba lagi nanti.";

            break;


          case "auth/unauthorized-domain":

            errorMessage =
              "Domain website belum diizinkan di Firebase Authentication. Tambahkan mhdfirza48-blip.github.io di Authorized domains.";

            break;


          case "auth/network-request-failed":

            errorMessage =
              "Koneksi internet bermasalah.";

            break;


          case "permission-denied":

            errorMessage =
              "Login berhasil, tetapi Firestore menolak akses data users.";

            break;


          default:

            errorMessage =
              "Error: " +
              (error.code || error.message);

            break;
        }


        showMessage(
          errorMessage,
          "error"
        );

      }


      loginButton.disabled = false;

      loginButton.textContent =
        "Login";

    });

  </script>

</body>
</html>
