<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - KerjaCuan</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0d1528;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 620px;
      background: #1e2a40;
      border-radius: 28px;
      padding: 45px 50px;
      box-shadow: 0 20px 50px rgba(0,0,0,.3);
    }

    .logo {
      text-align: center;
      font-size: 48px;
      font-weight: bold;
      color: #20d05a;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aebbd0;
      font-size: 25px;
      margin-bottom: 45px;
    }

    label {
      display: block;
      font-size: 20px;
      margin-bottom: 10px;
      color: #e7edf7;
    }

    input {
      width: 100%;
      height: 65px;
      padding: 0 20px;
      border-radius: 15px;
      border: 1px solid #45536b;
      outline: none;

      background: #0d162b;
      color: white;

      font-size: 19px;
      margin-bottom: 25px;
    }

    input:focus {
      border-color: #20d05a;
    }

    button {
      width: 100%;
      height: 65px;

      border: none;
      border-radius: 15px;

      background: #20c85a;
      color: white;

      font-size: 21px;
      font-weight: bold;

      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    .error {
      display: none;

      margin-top: 20px;
      padding: 18px;

      background: #8e1d20;
      color: white;

      border-radius: 12px;

      font-size: 17px;
      line-height: 1.5;
    }

    .success {
      display: none;

      margin-top: 20px;
      padding: 18px;

      background: #146c36;
      color: white;

      border-radius: 12px;

      font-size: 17px;
    }

    .register {
      text-align: center;
      margin-top: 35px;

      color: #aebbd0;
      font-size: 19px;
    }

    .register a {
      color: #20d05a;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .container {
        padding: 35px 25px;
      }

      .logo {
        font-size: 40px;
      }

      .subtitle {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      KerjaCuan
    </div>

    <div class="subtitle">
      Masuk ke akun kamu
    </div>

    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        id="email"
        type="email"
        placeholder="Masukkan email"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="Masukkan password"
        required
      >

      <button id="loginButton" type="submit">
        Login
      </button>

    </form>

    <div id="errorBox" class="error"></div>

    <div id="successBox" class="success">
      Login berhasil. Mengarahkan...
    </div>

    <div class="register">
      Belum punya akun?
      <a href="daftar.html">Daftar</a>
    </div>

  </div>


  <script type="module">

    import {
      auth,
      signInWithEmailAndPassword
    } from "./firebase.js";


    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    const loginButton = document.getElementById("loginButton");

    const errorBox = document.getElementById("errorBox");
    const successBox = document.getElementById("successBox");


    function showError(message) {

      errorBox.style.display = "block";
      errorBox.textContent = message;

      successBox.style.display = "none";
    }


    function showSuccess() {

      errorBox.style.display = "none";
      successBox.style.display = "block";
    }


    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;


      if (!email || !password) {

        showError("Email dan password wajib diisi.");

        return;
      }


      loginButton.disabled = true;
      loginButton.textContent = "Memproses...";


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


        showSuccess();


        setTimeout(() => {

          window.location.href = "index.html";

        }, 800);


      } catch (error) {

        console.error(error);

        let message = "Login gagal.";

        switch (error.code) {

          case "auth/invalid-credential":
          case "auth/wrong-password":
          case "auth/user-not-found":

            message =
              "Email atau password salah.";

            break;


          case "auth/invalid-api-key":

            message =
              "Firebase API key tidak valid. Pastikan firebase.js memakai konfigurasi project kerjacuan-374dd.";

            break;


          case "auth/operation-not-allowed":

            message =
              "Login Email/Password belum diaktifkan di Firebase Authentication.";

            break;


          case "auth/too-many-requests":

            message =
              "Terlalu banyak percobaan login. Coba lagi beberapa saat.";

            break;


          case "auth/network-request-failed":

            message =
              "Koneksi internet bermasalah.";

            break;


          default:

            message =
              error.message || "Terjadi kesalahan saat login.";
        }


        showError(message);

        loginButton.disabled = false;
        loginButton.textContent = "Login";

      }

    });

  </script>

</body>
</html>
