<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job - KerjaCuan</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

  <div>
    <div class="logo">KerjaCuan</div>
    <div id="emailUser"></div>
  </div>

  <div class="balance">
    <small>Saldo</small>
    <strong id="saldo">Rp 0</strong>
  </div>

</header>


<main class="container">

  <div class="card">

    <div style="color:#9aa6b8;letter-spacing:3px;">
      JOB
    </div>

    <h1>Kirim Hasil</h1>

    <p class="subtitle">
      Pilih pekerjaan yang tersedia.
      Reward masuk setelah hasil disetujui admin.
    </p>

  </div>


  <div id="jobs">
    Memuat job...
  </div>

</main>


<nav class="nav">

  <a href="index.html">
    <span>⌂</span>
    Beranda
  </a>

  <a class="active" href="job.html">
    <span>⇩</span>
    Job
  </a>

  <a href="tugas.html">
    <span>☑</span>
    Tugas
  </a>

  <a href="riwayat.html">
    <span>◷</span>
    Riwayat
  </a>

  <a href="saldo.html">
    <span>▣</span>
    Saldo
  </a>

  <a href="profil.html">
    <span>♙</span>
    Profil
  </a>

</nav>


<script type="module">

import {
  auth,
  db,
  onAuthStateChanged,
  collection,
  getDocs,
  doc,
  getDoc
} from "./firebase.js";


let user;


onAuthStateChanged(auth, async (u) => {

  if (!u) {

    window.location.href = "login.html";
    return;

  }

  user = u;

  document.getElementById("emailUser")
    .textContent = u.email;

  await loadUser();
  await loadJobs();

});


async function loadUser() {

  const snap =
    await getDoc(
      doc(db, "users", user.uid)
    );


  if (snap.exists()) {

    const data = snap.data();

    document.getElementById("saldo")
      .textContent =
      "Rp " +
      Number(data.saldo || 0)
        .toLocaleString("id-ID");

  }

}


async function loadJobs() {

  const snap =
    await getDocs(
      collection(db, "jobs")
    );


  const box =
    document.getElementById("jobs");

  box.innerHTML = "";


  if (snap.empty) {

    box.innerHTML = `
      <div class="card">
        <h2>Belum ada job</h2>
        <p class="subtitle">
          Saat ini belum ada pekerjaan tersedia.
        </p>
      </div>
    `;

    return;

  }


  snap.forEach(item => {

    const job = item.data();

    const div =
      document.createElement("div");

    div.className = "card";

    div.innerHTML = `

      <div class="job">

        <span class="reward">
          Reward Rp ${Number(job.reward || 0)
            .toLocaleString("id-ID")}
        </span>

        <h2>
          ${escapeHTML(job.title)}
        </h2>

        <p class="subtitle">
          ${escapeHTML(job.description)}
        </p>

        <button
          class="btn-blue"
          onclick="kerjakan('${item.id}')">
          Kerjakan
        </button>

      </div>

    `;

    box.appendChild(div);

  });

}


window.kerjakan = function(id) {

  window.location.href =
    "tugas.html?job=" + id;

};


function escapeHTML(text) {

  return String(text || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

</script>

</body>
</html>
