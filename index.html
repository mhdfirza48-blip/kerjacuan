<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - KerjaCuan</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: white;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #1e293b;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      color: #22c55e;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #e2e8f0;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #475569;
      border-radius: 10px;
      background: #0f172a;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #22c55e;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #64748b;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      background: #7f1d1d;
      color: #fecaca;
    }

    .success {
      background: #14532d;
      color: #bbf7d0;
    }

    .register {
      text-align: center;
      margin-top: 20px;
      color: #94a3b8;
      font-size: 14px;
    }

    .register a {
      color: #22c55e;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      KerjaCuan
    </div>

    <div class="subtitle">
      Masuk ke akun kamu
    </div>

    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Masukkan email"
        autocomplete="email"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Masukkan password"
        autocomplete="current-password"
        required
      >

      <button
        type="submit"
        id="loginButton"
      >
        Login
      </button>

    </form>

    <div
      id="errorBox"
      class="message error"
    ></div>

    <div
      id="successBox"
      class="message success"
    ></div>

    <div class="register">
      Belum punya akun?
      <a href="daftar.html">Daftar</a>
    </div>

  </div>


  <script type="module">

    import {
      auth,
      signInWithEmailAndPassword,
      db,
      doc,
      getDoc
    } from "./firebase.js";


    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const errorBox =
      document.getElementById("errorBox");

    const successBox =
      document.getElementById("successBox");


    function showError(text) {

      errorBox.textContent = text;

      errorBox.style.display = "block";

      successBox.style.display = "none";
    }


    function showSuccess(text) {

      successBox.textContent = text;

      successBox.style.display = "block";

      errorBox.style.display = "none";
    }


    function resetLoginButton() {

      loginButton.disabled = false;

      loginButton.textContent = "Login";
    }


    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        errorBox.style.display = "none";

        successBox.style.display = "none";


        if (!email) {

          showError(
            "Email wajib diisi."
          );

          return;
        }


        if (!password) {

          showError(
            "Password wajib diisi."
          );

          return;
        }


        loginButton.disabled = true;

        loginButton.textContent =
          "Memproses...";


        try {

          /*
           * LOGIN FIREBASE AUTH
           */

          const credential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            credential.user;


          /*
           * CEK DATA USER DI FIRESTORE
           */

          const userRef =
            doc(
              db,
              "users",
              user.uid
            );


          const userSnapshot =
            await getDoc(userRef);


          /*
           * JIKA DATA USER BELUM ADA
           */

          if (!userSnapshot.exists()) {

            showError(
              "Login berhasil, tetapi data pengguna belum ada di Firestore."
            );

            resetLoginButton();

            return;
          }


          const userData =
            userSnapshot.data();


          /*
           * SIMPAN DATA LOGIN
           */

          localStorage.setItem(
            "uid",
            user.uid
          );


          localStorage.setItem(
            "email",
            user.email || ""
          );


          localStorage.setItem(
            "role",
            userData.role || "user"
          );


          /*
           * LOGIN BERHASIL
           */

          showSuccess(
            "Login berhasil. Mengarahkan..."
          );


          /*
           * ADMIN
           */

          if (
            userData.role === "admin"
          ) {

            setTimeout(() => {

              window.location.href =
                "admin.html";

            }, 800);

            return;
          }


          /*
           * USER BIASA
           */

          setTimeout(() => {

            window.location.href =
              "index.html";

          }, 800);


        } catch (error) {

          console.error(
            "LOGIN ERROR:",
            error
          );


          let message =
            "Login gagal. Silakan coba lagi.";


          /*
           * EMAIL / PASSWORD SALAH
           */

          if (
            error.code ===
              "auth/invalid-credential" ||

            error.code ===
              "auth/wrong-password" ||

            error.code ===
              "auth/user-not-found"
          ) {

            message =
              "Email atau password salah.";
          }


          /*
           * API KEY
           */

          else if (
            error.code ===
            "auth/invalid-api-key"
          ) {

            message =
              "API Key Firebase tidak valid.";
          }


          /*
           * EMAIL TIDAK VALID
           */

          else if (
            error.code ===
            "auth/invalid-email"
          ) {

            message =
              "Format email tidak valid.";
          }


          /*
           * LOGIN EMAIL BELUM AKTIF
           */

          else if (
            error.code ===
            "auth/operation-not-allowed"
          ) {

            message =
              "Login Email/Password belum diaktifkan di Firebase Authentication.";
          }


          /*
           * TERLALU BANYAK PERCOBAAN
           */

          else if (
            error.code ===
            "auth/too-many-requests"
          ) {

            message =
              "Terlalu banyak percobaan login. Coba lagi nanti.";
          }


          /*
           * INTERNET
           */

          else if (
            error.code ===
            "auth/network-request-failed"
          ) {

            message =
              "Koneksi internet bermasalah.";
          }


          /*
           * ERROR LAIN
           */

          else if (error.message) {

            message =
              error.message;
          }


          /*
           * TAMPILKAN ERROR
           */

          showError(message);


          /*
           * PENTING:
           * TETAP DI HALAMAN LOGIN
           * DAN BISA COBA LAGI
           */

          resetLoginButton();

          passwordInput.value = "";

          passwordInput.focus();

        }

      }
    );

  </script>

</body>
</html>
