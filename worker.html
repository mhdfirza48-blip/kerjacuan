<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worker - KerjaCuan</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #14213d;
    }

    header {
      background: white;
      padding: 18px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .logo {
      color: #20b957;
      font-size: 32px;
      font-weight: 800;
    }

    .logout {
      background: #ef2939;
      color: white;
      border: 0;
      padding: 16px 25px;
      border-radius: 18px;
      font-size: 18px;
      font-weight: bold;
    }

    main {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 18px;
    }

    .card {
      background: white;
      border-radius: 35px;
      padding: 35px;
      margin-bottom: 30px;
      box-shadow: 0 8px 25px rgba(30,40,80,.07);
    }

    h1 {
      font-size: 40px;
      margin: 0 0 25px;
    }

    h2 {
      font-size: 32px;
      margin: 0 0 10px;
    }

    .muted {
      color: #778399;
      font-size: 22px;
      line-height: 1.5;
    }

    .balance {
      color: #20b957;
      font-size: 52px;
      font-weight: 800;
      margin-top: 8px;
    }

    .job {
      border: 1px solid #e3e7ef;
      border-radius: 22px;
      padding: 22px;
      margin-top: 18px;
    }

    .job h3 {
      margin: 0 0 10px;
      font-size: 25px;
    }

    .description {
      color: #667085;
      font-size: 17px;
      line-height: 1.5;
    }

    .reward {
      color: #20b957;
      font-size: 24px;
      font-weight: bold;
      margin: 15px 0;
    }

    .job button {
      width: 100%;
      border: 0;
      background: #20b957;
      color: white;
      padding: 15px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
    }

    .job button:disabled {
      background: #aaa;
    }

    .empty {
      color: #778399;
      font-size: 19px;
      text-align: center;
      padding: 20px 0;
    }

    .error {
      color: #d62828;
      background: #fff0f0;
      padding: 15px;
      border-radius: 12px;
      line-height: 1.5;
    }

    @media(max-width:600px) {
      .logo {
        font-size: 28px;
      }

      h1 {
        font-size: 34px;
      }

      .card {
        padding: 28px 22px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">KerjaCuan</div>
  <button class="logout" id="logout">Keluar</button>
</header>

<main>

    <div id="balance" class="balance">

    </div>
  </div>

  <div class="card">

    <div id="jobs">

    </div>
  </div>

  <div class="card">
    <h1>Kiriman Saya</h1>
    <div id="submissions" class="muted">
      Memuat...
    </div>
  </div>

</main>
