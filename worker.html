<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Worker - KerjaCuan</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #17233c;
    }

    header {
      background: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
      color: #16b957;
    }

    .logout {
      border: none;
      background: #2468c9;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      max-width: 1000px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .welcome {
      background: white;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .welcome h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .welcome p {
      margin: 0;
      color: #718096;
      font-size: 17px;
    }

    .section-title {
      font-size: 25px;
      font-weight: 800;
      margin: 25px 0 15px;
    }

    #jobs {
      display: grid;
      gap: 18px;
    }

    .job {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
      border: 1px solid #edf0f5;
    }

    .job h2 {
      margin: 0 0 10px;
      font-size: 21px;
    }

    .description {
      color: #667085;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .reward {
      font-size: 20px;
      font-weight: 800;
      color: #16a34a;
    }

    .status {
      display: inline-block;
      background: #dcfce7;
      color: #15803d;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin-top: 8px;
    }

    .work-btn {
      border: none;
      background: #20bf55;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .work-btn:hover {
      background: #16a34a;
    }

    .empty {
      background: white;
      padding: 35px;
      text-align: center;
      border-radius: 18px;
      color: #718096;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #718096;
    }

    .error {
      background: #fee2e2;
      color: #b91c1c;
      padding: 18px;
      border-radius: 12px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      header {
        padding: 16px 18px;
      }

      .logo {
        font-size: 27px;
      }

      main {
        margin-top: 25px;
        padding: 0 14px;
      }

      .welcome h1 {
        font-size: 24px;
      }

      .job {
        padding: 18px;
      }

      .bottom {
        align-items: flex-start;
        flex-direction: column;
      }

      .work-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">KerjaCuan</div>
  <button class="logout" id="logout">Keluar</button>
</header>

<main>

  </div>

</main>
