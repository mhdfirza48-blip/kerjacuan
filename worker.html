<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Worker - KerjaCuan</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<nav class="navbar">

  <a href="worker.html" class="logo">
    KerjaCuan
  </a>

  <button id="logout" class="btn btn-red">
    Keluar
  </button>

</nav>

<main class="container">

  <div class="card">

    <h2>Halo 👋</h2>

    <div id="name" class="muted">
      Memuat...
    </div>

    <p>Saldo kamu</p>

    <div id="balance" class="balance">
      Rp0
    </div>

  </div>


  <div class="card">

    <h2 class="title">Tugas</h2>

    <p class="muted">
      Pilih pekerjaan yang tersedia.
    </p>

    <div id="jobs">
      Memuat tugas...
    </div>

  </div>


  <div class="card">

    <h2 class="title">
      Kiriman Saya
    </h2>

    <div id="submissions">
      Memuat...
    </div>

  </div>

</main>


<script type="module">

import {
  auth,
  db,
  onAuthStateChanged,
  signOut,
  getDoc,
  getDocs,
  doc,
  collection,
  addDoc,
  query,
  orderBy,
  serverTimestamp
} from "./firebase.js";


const nameBox =
  document.getElementById("name");

const balanceBox =
  document.getElementById("balance");

const jobsBox =
  document.getElementById("jobs");

const submissionsBox =
  document.getElementById("submissions");


let currentUser = null;


function rupiah(value) {

  return new Intl.NumberFormat(
    "id-ID",
    {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0
    }
  ).format(value || 0);

}


onAuthStateChanged(auth, async user => {

  if (!user) {

    window.location.href = "login.html";
    return;

  }

  currentUser = user;

  await loadUser();
  await loadJobs();
  await loadSubmissions();

});


async function loadUser() {

  const snap =
    await getDoc(
      doc(db, "users", currentUser.uid)
    );

  if (!snap.exists()) return;

  const data = snap.data();

  nameBox.textContent =
    data.name || currentUser.email;

  balanceBox.textContent =
    rupiah(data.balance || 0);

}


async function loadJobs() {

  jobsBox.innerHTML = "";

  const q =
    query(
      collection(db, "jobs"),
      orderBy("createdAt", "desc")
    );

  const snap = await getDocs(q);

  let count = 0;

  snap.forEach(jobDoc => {

    const job = jobDoc.data();

    if (job.active === false) return;

    count++;

    const div =
      document.createElement("div");

    div.className = "job";

    div.innerHTML = `
      <h3>${esc(job.title)}</h3>

      <p class="muted">
        ${esc(job.description || "")}
      </p>

      <p class="reward">
        Reward ${rupiah(job.reward)}
      </p>

      <button class="btn btn-blue">
        Kerjakan
      </button>

      <div class="submit-area"></div>
    `;

    const button =
      div.querySelector("button");

    const area =
      div.querySelector(".submit-area");

    button.onclick = () => {

      button.style.display = "none";

      area.innerHTML = `

        <textarea
          class="result"
          placeholder="Tulis hasil pekerjaan kamu di sini..."
        ></textarea>

        <button class="btn btn-primary">
          Kirim Hasil
        </button>

      `;

      area.querySelector("button")
        .onclick = async () => {

          const result =
            area.querySelector(".result")
              .value
              .trim();

          if (!result) {

            alert("Hasil belum diisi.");
            return;

          }

          try {

            await addDoc(
              collection(db, "submissions"),
              {
                jobId: jobDoc.id,
                jobTitle: job.title,
                workerId: currentUser.uid,
                workerEmail: currentUser.email,
                result: result,
                reward: Number(job.reward) || 0,
                status: "pending",
                createdAt: serverTimestamp()
              }
            );

            alert(
              "Hasil berhasil dikirim dan menunggu persetujuan admin."
            );

            area.innerHTML =
              `<p class="success">
                Hasil sudah dikirim.
              </p>`;

            await loadSubmissions();

          } catch (error) {

            alert(
              "Gagal mengirim: " +
              error.message
            );

          }

        };

    };

    jobsBox.appendChild(div);

  });

  if (count === 0) {

    jobsBox.innerHTML =
      `<div class="empty">
        Belum ada tugas.
      </div>`;

  }

}


async function loadSubmissions() {

  submissionsBox.innerHTML = "";

  const snap =
    await getDocs(
      collection(db, "submissions")
    );

  let count = 0;

  snap.forEach(item => {

    const data = item.data();

    if (
      data.workerId !== currentUser.uid
    ) return;

    count++;

    const div =
      document.createElement("div");

    div.className = "job";

    div.innerHTML = `
      <h3>${esc(data.jobTitle || "Tugas")}</h3>

      <p>
        ${esc(data.result || "")}
      </p>

      <p>
        Reward:
        <b>${rupiah(data.reward)}</b>
      </p>

      <span class="status ${data.status}">
        ${esc(data.status)}
      </span>
    `;

    submissionsBox.appendChild(div);

  });

  if (count === 0) {

    submissionsBox.innerHTML =
      `<div class="empty">
        Belum ada kiriman.
      </div>`;

  }

}


function esc(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


document.getElementById("logout")
  .onclick = async () => {

    await signOut(auth);

    window.location.href =
      "login.html";

  };

</script>

</body>
</html>
