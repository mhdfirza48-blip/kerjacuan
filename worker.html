<script type="module">
async function loadJobs(user) {

  jobsBox.innerHTML = `
    <div class="loading">Memuat tugas...</div>
  `;

  try {

    const jobsRef = collection(db, "jobs");

    // Ambil semua dokumen dari koleksi jobs
    const snapshot = await getDocs(jobsRef);

    jobsBox.innerHTML = "";

    if (snapshot.empty) {
      jobsBox.innerHTML = `
        <div class="card">
          <div class="loading">
            Belum ada tugas tersedia.
          </div>
        </div>
      `;
      return;
    }

    let jumlah = 0;

    snapshot.forEach((jobDoc) => {

      const job = jobDoc.data();

      // Hanya tampilkan Job yang statusnya active
      if (String(job.status || "").toLowerCase() !== "active") {
        return;
      }

      jumlah++;

      const title = job.title || "Tugas";
      const description =
        job.description || "Tidak ada deskripsi.";

      const reward = Number(job.reward || 0);

      const div = document.createElement("div");

      div.className = "job";

      div.innerHTML = `
        <h3>${escapeHTML(title)}</h3>

        <p>
          ${escapeHTML(description)}
        </p>

        <div class="reward">
          Reward:
          Rp${reward.toLocaleString("id-ID")}
        </div>

        <button class="ambil">
          Ambil Tugas
        </button>
      `;

      div.querySelector(".ambil").onclick = () => {
        ambilTugas(jobDoc.id, job, user);
      };

      jobsBox.appendChild(div);
    });

    if (jumlah === 0) {
      jobsBox.innerHTML = `
        <div class="card">
          <div class="loading">
            Belum ada tugas aktif.
          </div>
        </div>
      `;
    }

  } catch (error) {

    console.error("ERROR JOB:", error);

    jobsBox.innerHTML = `
      <div class="error">
        <b>Gagal memuat tugas.</b>
        <br><br>
        ${escapeHTML(error.message)}
      </div>
    `;
  }
}
</script>
