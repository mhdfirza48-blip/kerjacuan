<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job - KerjaCuan</title><link rel="stylesheet" href="styles.css"></head><body><header class="top"><div class="brand">KerjaCuan</div><button id="logout" class="btn danger">Keluar</button></header><main class="container"><section class="card"><div class="muted">Halo,</div><h2 id="name">...</h2><div class="muted">Saldo kamu</div><div id="balance" class="balance">Rp0</div></section><section class="card"><div class="muted">JOB</div><h1>Kirim hasil</h1><p class="muted">Pilih job, kerjakan sesuai instruksi, lalu kirim bukti. Reward masuk setelah admin menyetujui hasil.</p><div class="notice">⏱ Estimasi ACC 1–2 Hari<br>Akun/proyek diproses setelah disetujui admin.</div></section><section><h2>Daftar Job</h2><div id="jobs" class="grid"></div></section></main><nav class="bottom"><a href="worker.html">⌂<br>Beranda</a><a href="worker.html">⇩<br>Job</a><a href="#jobs">☑<br>Tugas</a><a href="#jobs">◷<br>Riwayat</a><a href="#top">Rp<br>Saldo</a></nav><script type="module">
import {auth,db,onAuthStateChanged,signOut,doc,getDoc,collection,query,orderBy,getDocs,addDoc,serverTimestamp} from "./firebase.js";
const money=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n||0);
let me;
onAuthStateChanged(auth,async u=>{if(!u)return location.href="login.html";me=u;const p=await getDoc(doc(db,"users",u.uid));$("name").textContent=p.data()?.name||u.email;$("balance").textContent=money(p.data()?.balance);loadJobs();});
$("logout").onclick=()=>signOut(auth).then(()=>location.href="login.html");
async function loadJobs(){const box=$("jobs");box.innerHTML="";const snap=await getDocs(query(collection(db,"jobs"),orderBy("createdAt","desc")));if(snap.empty){box.innerHTML='<div class="card muted">Belum ada tugas.</div>';return}for(const d of snap.docs){const j=d.data();if(j.status==="closed")continue;const el=document.createElement("div");el.className="job";el.innerHTML=`<div class="row"><span class="pill">${j.category||"Job"}</span><span class="reward">Reward ${money(j.reward)}</span></div><h3>${esc(j.title)}</h3><p>${esc(j.description)}</p><div class="muted">Batas: ${esc(j.limit||"Tidak ditentukan")}</div><br><button class="btn secondary">Kerjakan</button>`;el.querySelector("button").onclick=()=>submitJob(d.id,j);box.appendChild(el)}}
async function submitJob(jobId,j){const result=prompt("Masukkan hasil/bukti pengerjaan untuk job ini:");if(!result)return;await addDoc(collection(db,"submissions"),{jobId,jobTitle:j.title,workerId:me.uid,workerEmail:me.email,result,status:"pending",reward:j.reward,createdAt:serverTimestamp()});alert("Hasil terkirim. Menunggu persetujuan admin.");}
function esc(s=""){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script></body></html>
