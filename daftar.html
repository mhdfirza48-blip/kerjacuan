<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daftar - KerjaCuan</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="auth">

  <div class="card">

    <div class="center">
      <div class="logo">KerjaCuan</div>
      <p class="subtitle">
        Buat akun baru
      </p>
    </div>

    <label>Email</label>

    <input
      id="email"
      type="email"
      placeholder="Masukkan email"
    >

    <label>Password</label>

    <input
      id="password"
      type="password"
      placeholder="Minimal 6 karakter"
    >

    <button
      class="btn"
      id="daftarBtn">
      Daftar
    </button>

    <p id="error" class="center"></p>

    <p class="center">
      Sudah punya akun?
      <a class="link" href="login.html">
        Login
      </a>
    </p>

  </div>

</div>


<script type="module">

import {
  auth,
  db,
  createUserWithEmailAndPassword,
  doc,
  setDoc
} from "./firebase.js";


document
  .getElementById("daftarBtn")
  .onclick = async function() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    if (!email || !password) {
      document.getElementById("error").textContent =
        "Email dan password wajib diisi.";
      return;
    }


    if (password.length < 6) {
      document.getElementById("error").textContent =
        "Password minimal 6 karakter.";
      return;
    }


    try {

      const result =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


      await setDoc(
        doc(db, "users", result.user.uid),
        {
          email: email,
          saldo: 0,
          role: "worker",
          createdAt: new Date()
        }
      );


      window.location.href = "job.html";


    } catch(error) {

      document.getElementById("error").textContent =
        error.message;

    }

  };

</script>

</body>
</html>
